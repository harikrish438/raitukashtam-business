server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: mycommunity-service
  main:
    time-zone: Asia/Kolkata
  cloud:
    compatibility-verifier:
      enabled: false
    vault:
      host: ${VAULT_HOST:localhost}
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:raitukashtam-vault-token}
      kv:
        enabled: true
        backend: secret
        default-context: mycommunity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mycommunity-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:mycommunity-service-user}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8080}/oauth2/jwks
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}

# aws.s3.access-key / aws.s3.secret-key come from Vault (secret/mycommunity-service),
# same pattern as spring.datasource.password -- no default here.
aws:
  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket-name: ${S3_BUCKET_NAME:mycommunity-documents}
    endpoint-override: ${S3_ENDPOINT_OVERRIDE:}
    auto-create-bucket: ${AWS_S3_AUTO_CREATE_BUCKET:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  server:
    port: 8081
