# DEV environment — mycommunity-service
# run with (from this directory, backend/mycommunity-service/): docker compose up -d
# Requires: .env file (copy from .env.example), and this repo's own
#   shared-infra stack already running (docker compose up -d from the
#   repo root) since this stack joins its Vault/Redis/network — no
#   dependency on the raitukashtam platform repo.
networks:
  raitukashtam-network:
    external: true
    name: raitukashtam-network

volumes:
  mycommunity-pgdata:
  mycommunity-logs:
  mycommunity-localstack-data:

services:

  # LocalStack -- dev-only S3 emulator for Phase 11 (Community Documents),
  # so document upload/download can be exercised without real AWS
  # credentials or cost. Not present in docker-compose.test.yml/.prod.yml --
  # those point mycommunity-service at real AWS S3 instead (see this
  # service's own CLAUDE.md).
  localstack:
    image: localstack/localstack:3
    container_name: mycommunity-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-south-1
    ports:
      - "4566:4566"
    volumes:
      - mycommunity-localstack-data:/var/lib/localstack
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mycommunity-postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    image: postgres:15
    container_name: mycommunity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mycommunity-service-db
      POSTGRES_USER: mycommunity-service-user
      POSTGRES_PASSWORD: ${MYCOMMUNITY_DB_PASSWORD:-mycommunity-service-password}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
      POSTGRES_INITDB_ARGS: '--data-checksums --encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8 --no-locale'
    command: ["postgres", "-c", "timezone=Asia/Kolkata", "-c", "log_timezone=Asia/Kolkata"]
    ports:
      - "5434:5432"
    volumes:
      - mycommunity-pgdata:/var/lib/postgresql/data
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycommunity-service-user -d mycommunity-service-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mycommunity-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
    container_name: mycommunity-service
    restart: unless-stopped
    volumes:
      - mycommunity-logs:/var/log
    depends_on:
      mycommunity-postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      VAULT_HOST: vault
      VAULT_TOKEN: ${VAULT_TOKEN:-raitukashtam-vault-token}
      SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT: mycommunity-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://mycommunity-postgres:5432/mycommunity-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: mycommunity-service-user
      AUTH_SERVICE_URL: http://auth-service:8080
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: mycommunity-documents-dev
      S3_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_S3_AUTO_CREATE_BUCKET: "true"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007"
    ports:
      - "8081:8081"
      - "5007:5007"
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
