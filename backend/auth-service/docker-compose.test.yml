# TEST environment — auth-service
# run with (from this directory, backend/auth-service/):
#   docker compose -f docker-compose.test.yml --env-file .env.test up -d
# Requires: .env.test file, and this repo's own shared-infra test stack
# already running (docker compose -f docker-compose.test.yml --env-file
# .env.test up -d from the repo root) since this stack joins its
# Vault/Redis/raitukashtam-network — no dependency on the raitukashtam
# platform repo.
networks:
  raitukashtam-network:
    external: true
    name: raitukashtam-network

volumes:
  auth-pgdata-test:

services:

  auth-postgres:
    image: postgres:15
    container_name: auth-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: jwt_auth_db
      POSTGRES_USER: jwt_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required in .env.test}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata", "-c", "log_timezone=Asia/Kolkata"]
    volumes:
      - auth-pgdata-test:/var/lib/postgresql/data
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwt_user -d jwt_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
    container_name: auth-service-test
    restart: unless-stopped
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      VAULT_HOST: vault-test
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required in .env.test}
      SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres-test:5432/jwt_auth_db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: jwt_user
      SPRING_REDIS_HOST: redis-test
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env.test}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required in .env.test}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      WEB_CLIENT_REDIRECT_URI: ${WEB_CLIENT_REDIRECT_URI:?WEB_CLIENT_REDIRECT_URI is required in .env.test}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in .env.test}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required in .env.test}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
    ports:
      - "8080:8080"
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
