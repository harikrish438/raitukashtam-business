# DEV environment — auth-service
# run with (from this directory, backend/auth-service/): docker compose up -d
# Requires: .env file (copy from .env.example), and this repo's own
# shared-infra stack already running (docker compose up -d from the repo
# root) since this stack joins its Vault/Redis/raitukashtam-network — no
# dependency on the raitukashtam platform repo.
networks:
  raitukashtam-network:
    external: true
    name: raitukashtam-network

volumes:
  auth-pgdata:
  auth-logs:

services:

  auth-postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    image: postgres:15
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jwt_auth_db
      POSTGRES_USER: jwt_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-jwt_password}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
      POSTGRES_INITDB_ARGS: '--data-checksums --encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8 --no-locale'
    command: ["postgres", "-c", "timezone=Asia/Kolkata", "-c", "log_timezone=Asia/Kolkata"]
    ports:
      - "5435:5432"
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwt_user -d jwt_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
    container_name: auth-service
    restart: unless-stopped
    volumes:
      - auth-logs:/var/log
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      VAULT_HOST: vault
      VAULT_TOKEN: ${VAULT_TOKEN:-raitukashtam-vault-token}
      SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/jwt_auth_db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: jwt_user
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password}
      MAIL_USERNAME: ${MAIL_USERNAME:-raitukashtam@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      WEB_CLIENT_REDIRECT_URI: ${WEB_CLIENT_REDIRECT_URI:-http://localhost:3000/callback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008"
    ports:
      - "8080:8080"
      - "5008:5008"
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
