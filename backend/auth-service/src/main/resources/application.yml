server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: auth-service
  cloud:
    compatibility-verifier:
      enabled: false
    vault:
      host: ${VAULT_HOST:localhost}
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:raitukashtam-vault-token}
      kv:
        enabled: true
        backend: secret
        default-context: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/jwt_auth_db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:jwt_user}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
        SET timezone = 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
  session:
    store-type: redis
    redis:
      flush-mode: on_save
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:raitukashtam@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com
      "[mail.smtp.ehlo]": true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production}
  issuer: raitukashtam
  access-token-exp-ms: 3600000
  refresh-token-exp-ms: 604800000
  access-expiration: 3600000
  refresh-expiration: 604800000
  clock-skew: 60
  audience: raitukashtam-client
  header-names:
    access-token: Authorization
    refresh-token: X-Refresh-Token
    token-type: Bearer

otp:
  expiry:
    minutes: 10

twofactor:
  api:
    key: ${TWOFACTOR_API_KEY:}
    url: "https://2factor.in/API/V1/%s/SMS/%s/AUTOGEN"
    verify-url: "https://2factor.in/API/V1/%s/SMS/VERIFY/%s/%s"

security:
  login:
    max-attempts: 5
    captcha-required-after-attempts: 3
    lockout-duration: 30m
    failure-window: 15m

raitukashtam:
  default-product-code: RAITUKASHTAM
  default-product-name: Raitukashtam
  web-client:
    redirect-uri: ${WEB_CLIENT_REDIRECT_URI:http://localhost:3000/callback}
  mycommunity-product-code: MYCOMMUNITY
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  recaptcha:
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: https://www.google.com/recaptcha/api/siteverify

app:
  base-url: ${APP_BASE_URL:http://localhost:8080/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  server:
    port: 8080
  health:
    redis:
      enabled: false
    mail:
      enabled: false
