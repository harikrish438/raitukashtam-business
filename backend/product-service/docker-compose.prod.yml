# PROD environment — product-service
# run with (from this directory, backend/product-service/):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Requires: .env.prod file, a GITHUB_TOKEN env var with read:packages scope,
#   and the raitukashtam platform prod stack already running
#   (docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   in the raitukashtam repo) since this stack joins its network.
networks:
  raitukashtam-network:
    external: true
    name: raitukashtam-network

volumes:
  product-pgdata-prod:

secrets:
  github_token:
    environment: GITHUB_TOKEN

services:

  product-postgres:
    image: postgres:15
    container_name: product-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: product-service-db
      POSTGRES_USER: product-service-user
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required in .env.prod}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata", "-c", "log_timezone=Asia/Kolkata", "-c", "max_connections=200"]
    volumes:
      - product-pgdata-prod:/var/lib/postgresql/data
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product-service-user -d product-service-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  product-service:
    build:
      context: .
      secrets:
        - github_token
    container_name: product-service-prod
    restart: always
    depends_on:
      product-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      VAULT_HOST: ${VAULT_HOST:?VAULT_HOST is required in .env.prod}
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required in .env.prod}
      SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT: product-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-postgres:5432/product-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: product-service-user
      AUTH_SERVICE_URL: http://auth-service:8080
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: product-service
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      CONFIG_SERVER_URL: http://config-server-service:9002
    ports:
      - "8081:8081"
    networks:
      - raitukashtam-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
