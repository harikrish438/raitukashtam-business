server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: product-service
  tracing:
    propagation:
      type: w3c
  main:
    time-zone: Asia/Kolkata
  cloud:
    compatibility-verifier:
      enabled: false
    vault:
      host: ${VAULT_HOST:localhost}
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:raitukashtam-vault-token}
      kv:
        enabled: true
        backend: secret
        default-context: product-service
    discovery:
      enabled: true
    loadbalancer:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/product-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:product-service-user}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: true
    registry-fetch-interval-seconds: 30
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    appname: product-service

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production}
  issuer: raitukashtam
  access-expiration: 3600000
  refresh-expiration: 604800000

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  server:
    port: 8081
