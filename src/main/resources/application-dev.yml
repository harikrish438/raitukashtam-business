spring:
  config:
    import:
      - "optional:vault://"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:9002}"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

# Dev-only default keypair, checked in (same treatment as jwt.secret's dev
# default) -- deliberately NOT in the shared application.yml, so test/prod
# have no fallback path to it at all; Vault must supply these there or the
# app fails to start. Regenerate with a jshell one-liner (NOT
# `openssl genpkey` -- its PKCS8 encoding is not decodable by this JDK's
# KeyFactory, "algid parse error, not a sequence"; confirmed live):
#   jshell -q <<'EOF'
#   import java.security.*; import java.util.Base64;
#   var kp = KeyPairGenerator.getInstance("RSA"); kp.initialize(2048);
#   var pair = kp.generateKeyPair();
#   System.out.println(Base64.getEncoder().encodeToString(pair.getPrivate().getEncoded()));
#   System.out.println(Base64.getEncoder().encodeToString(pair.getPublic().getEncoded()));
#   EOF
jwt:
  signing-key:
    private-key: ${JWT_SIGNING_KEY_PRIVATE:}
    public-key: ${JWT_SIGNING_KEY_PUBLIC:}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    io.micrometer.tracing: DEBUG
    org.springframework.boot.actuate.tracing: DEBUG
