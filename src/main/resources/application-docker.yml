server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:http://config-server-service:9002"
  cloud:
    compatibility-verifier:
      enabled: false
    discovery:
      enabled: true
  datasource:
    url: jdbc:postgresql://product-postgres:5432/product-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
    username: product-service-user
    password: product-service-password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
        SET timezone = 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://discovery-service:8761/eureka/
    enabled: true
    registry-fetch-interval-seconds: 30
  instance:
    hostname: product-service
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    appname: product-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  server:
    port: 8081

logging:
  level:
    org.springframework.cloud: DEBUG
    com.netflix.eureka: DEBUG
