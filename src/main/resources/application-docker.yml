server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: product-service
  config:
    import:
      - "vault://"
      - "optional:configserver:http://config-server-service:9002"
  cloud:
    compatibility-verifier:
      enabled: false
    vault:
      host: vault
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:raitukashtam-vault-token}
      kv:
        enabled: true
        backend: secret
        default-context: product-service
    discovery:
      enabled: true
    loadbalancer:
      enabled: true
  datasource:
    url: jdbc:postgresql://product-postgres:5432/product-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
    username: product-service-user
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
        SET timezone = 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://discovery-service:8761/eureka/
    enabled: true
    registry-fetch-interval-seconds: 30
  instance:
    hostname: product-service
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    appname: product-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  server:
    port: 8081
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  level:
    org.springframework.cloud: DEBUG
    com.netflix.eureka: DEBUG
    com.raitukashtam.jwt.filter: DEBUG
    org.springframework.web: DEBUG

jwt:
  secret: your-secret-key-change-this-in-production
  issuer: raitukashtam
  access-expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Docker-specific auth service URL (uses service discovery)
auth:
  service:
    url: http://auth-service
