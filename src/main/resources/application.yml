server:
  port: 8081
  address: 0.0.0.0  # Listen on all network interfaces

spring:
  tracing:
    propagation:
      type: w3c
    zipkin:
      endpoint: http://localhost:9411/api/v2/spans
  config:
    import: "optional:configserver:CONFIG-SERVER-SERVICE"
  main:
    time-zone: Asia/Kolkata
  application:
    name: product-service
  cloud:
    compatibility-verifier:
      enabled: false
    discovery:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/product-service-db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
    username: product-service-user
    password: product-service-password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://discovery-service:8761/eureka/
    enabled: true
    registry-fetch-interval-seconds: 30
  instance:
    hostname: product-service
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    appname: product-service

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # 100% sampling, adjust in production

jwt:
  secret: your-secret-key-change-this-in-production
  issuer: raitukashtam
  access-expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS+05:30} %5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}] %thread --- [%t] %-40.40logger{39} : %m%n"
  level:
    org.springframework.web: DEBUG
    io.micrometer.tracing: DEBUG
    org.springframework.boot.actuate.tracing: DEBUG
