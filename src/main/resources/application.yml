server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://config-server-service:9002"
  tracing:
    propagation:
      type: w3c
  cloud:
    compatibility-verifier:
      enabled: false
    discovery:
      enabled: true
    eureka:
      client:
        service-url:
          default-zone: http://discovery-service:8761/eureka/
        enabled: true
        register-with-eureka: true
        fetch-registry: true
        registry-fetch-interval-seconds: 30
      instance:
        hostname: auth-service
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 30
        lease-expiration-duration-in-seconds: 90
        appname: auth-service
        metadata:
          management:
            port: 8080
          health-check-url-path: /actuator/health
          status-page-url-path: /actuator/info
          home-page-url-path: /

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    org.springframework.web: DEBUG
    io.micrometer.tracing: DEBUG
    org.springframework.boot.actuate.tracing: DEBUG
