spring:
  config:
    import:
      - "vault://"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:9002}/config"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Swagger UI/OpenAPI docs are permitAll (needed for the docs page itself to
# load), which hands anyone who can reach this service a map of the API
# surface. Fine in dev/test; disabled here since prod is internet-facing.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.raitukashtam: INFO
    org.springframework.security: WARN
