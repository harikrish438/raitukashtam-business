server:
  port: 8080
  address: 0.0.0.0  # Listen on all network interfaces
  servlet:
    context-path: /
    host: localhost

spring:
  tracing:
    propagation:
      type: w3c
    zipkin:
      endpoint: http://localhost:9411/api/v2/spans
  config:
    import: "optional:configserver:CONFIG-SERVER-SERVICE"
  main:
    time-zone: Asia/Kolkata
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/jwt_auth_db?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Kolkata
    username: jwt_user
    password: jwt_password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 120000
      connection-init-sql: |
        SET TIME ZONE 'Asia/Kolkata';
        SET timezone = 'Asia/Kolkata';
      data-source-properties:
        prepareThreshold: 0
        preferQueryMode: simple
  mail:
    host: smtp.gmail.com
    port: 587
    username: raitukashtam@gmail.com
    password: jlmm llbs wgtu hvko
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com
  redis:
    host: localhost
    port: 6379
  session:
    store-type: redis
    redis:
      flush-mode: on_save
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: true

jwt:
  # JWT Configuration
  secret: your-secret-key-change-this-in-production
  issuer: raitukashtam
  
  # Token expiration times in milliseconds
  access-token-exp-ms: 3600000       # 1 hour
  refresh-token-exp-ms: 604800000    # 7 days
  access-expiration: 3600000         # Alias for backward compatibility
  refresh-expiration: 604800000      # Alias for backward compatibility
  
  # Token validation settings
  clock-skew: 60  # 60 seconds clock skew for token validation
  
  # Token issuer and audience
  audience: raitukashtam-client
  
  # Token headers
  header-names:
    access-token: Authorization
    refresh-token: X-Refresh-Token
    token-type: Bearer
# OTP Configuration
app:
  otp:
    expiry:
      minutes: 10  # OTP expiration time in minutes
  base-url: http://${server.servlet.host}:${server.port}${server.servlet.context-path}

