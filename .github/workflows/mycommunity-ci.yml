name: MyCommunity CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/mycommunity-service/**"
  pull_request:
    paths:
      - "backend/mycommunity-service/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test mycommunity-service
        run: mvn -B verify
        working-directory: backend/mycommunity-service
